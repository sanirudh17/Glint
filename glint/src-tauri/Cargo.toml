[package]
name = "glint"
version = "0.2.1"
description = "Glint – local-first Windows screenshot & screen-recording app"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-log = "2.8.0"
log = "0.4.33"
tauri-plugin-global-shortcut = "2.3.2"
xcap = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
clipboard-win = "5.4.1"
base64 = "0.22"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
winreg = "0.52"
tauri-plugin-shell = "2"
regex = "1"
font8x8 = "0.3"
# Direct handle on the (already-transitive via Tauri) tokio runtime, only for
# `tokio::time` — used to bound the recorder's graceful-stop wait and the
# pre-record countdown. Unifies with Tauri's resolved tokio version.
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "rt"] }
# WASAPI capture (mic) + loopback (system audio) — install-free system audio.
wasapi = "0.15"
# Win32 SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE) so the recorder control
# bar is excluded from gdigrab's screen capture (visible on screen, absent from
# the video). HWND is fetched via raw-window-handle to stay version-independent
# of whichever `windows` version Tauri resolves.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
] }
raw-window-handle = "0.6"
# In-app updater: fetch the latest GitHub release installer and launch it. A tiny
# blocking HTTP client with bundled rustls TLS + webpki roots (no OpenSSL / system
# cert store) and automatic redirect-following (GitHub asset URLs 302 to a CDN).
# The download runs on a spawned thread, so a blocking client is the right shape.
ureq = "2"
sha2 = "0.10"


# CPU-only screenshot OCR; models are installed separately.
[dependencies.oar-ocr]
version = "=0.10.0"
default-features = false
features = ["simd"]

[dependencies.ort]
version = "=2.0.0-rc.13"
default-features = false
features = ["std", "load-dynamic"]
