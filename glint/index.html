<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glint</title>
    <style>
      /* Prevent white flash before webview paints. */
      html, body { background: var(--bg, #0C0D0F); margin: 0; }
      :root[data-theme="dark"] { --bg: #0C0D0F; }
      :root[data-theme="light"] { --bg: #F6F7F9; }
      /* Gate transitions until settings are fully hydrated and first frame is rendered.
         Without this, color switches animate visibly on startup. */
      html:not(.ready) *, :root:not(.ready) * {
        transition: none !important;
        animation: none !important;
      }
    </style>
    <script>
      (function () {
        try {
          var hash = window.location.hash || "";
          var isTransient =
            hash.indexOf("#/overlay") === 0 ||
            hash.indexOf("#/hud") === 0 ||
            hash.indexOf("#/pin") === 0 ||
            hash.indexOf("#/rec-bar") === 0 ||
            hash.indexOf("#/rec-countdown") === 0 ||
            hash.indexOf("#/rec-select") === 0 ||
            hash.indexOf("#/rec-hud") === 0 ||
            hash.indexOf("#/rec-cam") === 0 ||
            hash.indexOf("#/rec-fx") === 0;
          if (isTransient) {
            document.documentElement.style.background = "transparent";
            var setBodyTransparent = function () {
              if (document.body) document.body.style.background = "transparent";
              else requestAnimationFrame(setBodyTransparent);
            };
            setBodyTransparent();
          }

          var THEME_KEY = "glint.theme";
          var ACCENT_KEY = "glint.accent";
          var palette = {
            "#5b7cfa": { hover: "#6D8BFA", subtle: "rgba(91, 124, 250, 0.12)" },
            "#2baaad": { hover: "#3DBBBF", subtle: "rgba(43, 170, 173, 0.12)" },
            "#7c6efa": { hover: "#8F83FB", subtle: "rgba(124, 110, 250, 0.12)" },
            "#d4870a": { hover: "#E0951A", subtle: "rgba(212, 135, 10, 0.12)" },
            "#d95f76": { hover: "#E4708A", subtle: "rgba(217, 95, 118, 0.12)" },
          };
          var boot = window.__GLINT_BOOT__;
          var storedTheme = (boot && boot.theme) || null;
          var storedAccent = (boot && boot.accent) || null;
          if (!storedTheme || !storedAccent) {
            try {
              if (!storedTheme) storedTheme = localStorage.getItem(THEME_KEY);
              if (!storedAccent) storedAccent = localStorage.getItem(ACCENT_KEY);
            } catch (e) {}
          }
          if (storedTheme) {
            try { localStorage.setItem(THEME_KEY, storedTheme); } catch (e) {}
          }
          if (storedAccent) {
            try { localStorage.setItem(ACCENT_KEY, storedAccent); } catch (e) {}
          }

          var theme = storedTheme || "dark";
          if (theme === "system") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.setProperty("--bg", theme === "light" ? "#F6F7F9" : "#141518");

          if (storedAccent) {
            var key = storedAccent.toLowerCase();
            var entry = palette[key];
            var root = document.documentElement;
            if (entry) {
              root.style.setProperty("--accent", storedAccent);
              root.style.setProperty("--accent-hover", entry.hover);
              root.style.setProperty("--accent-subtle", entry.subtle);
            } else {
              root.style.setProperty("--accent", storedAccent);
              try {
                var hex = storedAccent.replace("#", "").trim();
                if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
                var r = parseInt(hex.slice(0, 2), 16);
                var g = parseInt(hex.slice(2, 4), 16);
                var b = parseInt(hex.slice(4, 6), 16);
                if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
                  var hr = Math.min(255, Math.round(r + (255 - r) * 0.12));
                  var hg = Math.min(255, Math.round(g + (255 - g) * 0.12));
                  var hb = Math.min(255, Math.round(b + (255 - b) * 0.12));
                  root.style.setProperty("--accent-hover", "rgb(" + hr + "," + hg + "," + hb + ")");
                  root.style.setProperty("--accent-subtle", "rgba(" + r + "," + g + "," + b + ",0.12)");
                }
              } catch (e2) {}
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
